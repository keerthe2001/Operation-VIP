project:
  slug: capstone-production-agent
  title: 'Capstone: a production agentic AI app'
  body:
    problem: 'Build and deploy a complete agentic AI application for a real domain: it ingests documents, retrieves
      with hybrid search and reranking, uses tools through an agent with memory and approval steps, runs as an API,
      and is evaluated, traced and cost-optimised.'
    requirements:
    - Document ingestion and RAG over a real domain with citations
    - Hybrid retrieval with reranking and measured improvement
    - An agent with at least two domain tools, validation and one approval-gated action
    - State, checkpoints and user-deletable memory
    - A deployed FastAPI service with an evaluation gate, tracing and cost numbers
    milestones:
    - Ingestion and RAG
    - Embeddings and vector search
    - Retrieval and reranking
    - Agent tools
    - State and memory
    - Workflow graph
    - API
    - Evaluation and observability
    - Cost and performance
    - Deployment and README
    rubric:
    - name: RAG quality
      points: 20
      pass: Cited, grounded answers; abstains when it should
    - name: Agent and tools
      points: 20
      pass: Useful tools, validation, approval gate
    - name: Engineering
      points: 20
      pass: API, state, checkpoints, deployment
    - name: Evidence
      points: 25
      pass: Test set, metrics, traces, cost numbers, before/after tables
    - name: Communication
      points: 15
      pass: README and walkthrough a reviewer can follow
    pass_mark: 75
    submit: Push to a public GitHub repository, put the live URL in the demo field, and link a 3-minute walkthrough
      in the notes.
