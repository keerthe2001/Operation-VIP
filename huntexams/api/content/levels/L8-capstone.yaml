        node: ing
        state:
          building: Ingestion and RAG
          proof: a milestone in your mission
        tone: good
        caption: When this part works, tick its milestone in the capstone mission.
    points:
    - title: Real documents
      text: Use a domain you can test with real questions.
      step: 1
    - title: Repeatable ingestion
      text: One command rebuilds the index from scratch.
    - title: Metadata from day one
      text: Source, page and date for every chunk.
      step: 2
    checks:
    - id: cap-ing-1
      type: mcq
      prompt: Which capstone domain is strongest?
      options:
      - '''All knowledge on the internet'''
      - Your state's scholarship scheme FAQs and rules
      - Random Wikipedia pages
      answer: 1
      explain: Narrow and real means you can test it properly.
    - id: cap-ing-2
      type: order
      prompt: Order the ingestion part of your capstone.
      items:
      - Collect documents
      - Load and clean
      - Chunk with metadata
      - Embed and store
      explain: Same as Level 4, now for your own domain.
