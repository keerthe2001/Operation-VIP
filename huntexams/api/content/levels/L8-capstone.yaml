      options:
      - Yes, always
      - 'Probably not: +2 points isn''t worth breaking the latency budget'
      answer: 1
      explain: Every addition is a trade-off; write it down.
    - id: cap-ret-2
      type: order
      prompt: Order the retrieval stack.
      items:
      - Hybrid retrieve top 30
      - Rerank
      - Keep top 4
      explain: Wide, then precise.
