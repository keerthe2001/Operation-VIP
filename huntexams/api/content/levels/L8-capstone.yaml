number: 8
slug: capstone
title: Capstone
summary: Build and deploy one complete agentic AI application that proves everything you've learned.
hours: 30
topics:
- slug: capstone-ingestion
  title: Ingestion and RAG
  summary: 'Your capstone starts with its own documents: pick a real domain, ingest, clean and chunk it.'
  minutes: 10
  body:
    objectives:
    - Pick a domain with real documents (college rules, a product manual, government scheme FAQs)
    - Write a repeatable ingestion script with metadata
    - Justify your chunking with numbers
    intro: 'Your capstone starts with its own documents: pick a real domain, ingest, clean and chunk it. Choose
      documents people actually need answers from. A narrow, real domain beats a broad, vague one.'
    scenes:
    - engine: graph
      title: 'Your capstone: ingestion and rag'
      track:
      - Whole system
      - This part
      - Done
      nodes:
        ing:
          x: 60
          y: 60
          label: ingest
        db:
          x: 180
          y: 60
          label: vector store
        ret:
          x: 300
          y: 60
          label: retrieve + rerank
        agent:
          x: 380
          y: 140
          label: agent + tools
        mem:
          x: 300
          y: 200
          label: state + memory
        flow:
          x: 180
          y: 200
          label: workflow graph
        api:
          x: 60
          y: 200
          label: API
        eval:
          x: 60
          y: 130
          label: eval + traces
        cost:
          x: 180
          y: 130
          label: cost + speed
        dep:
          x: 300
          y: 130
          label: deployed
      edges:
      - - ing
        - db
      - - db
        - ret
      - - ret
        - agent
      - - agent
        - mem
      - - agent
        - flow
      - - flow
        - api
      - - api
        - eval
      - - eval
        - cost
      - - cost
        - dep
      steps:
      - at: 0
        node: ing
        state:
          capstone: 10 parts
        caption: Your capstone is one system with ten parts. Each topic in this level builds one.
      - at: 1
        node: ing
        dim:
        - db
        - ret
        - agent
        - mem
        - flow
        - api
        - eval
        - cost
        - dep
        state:
          building: Ingestion and RAG
        caption: 'This topic: Ingestion and RAG. Your capstone starts with its own documents: pick a real domain,
          ingest, clean and chunk it.'
