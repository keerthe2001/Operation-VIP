- slug: similarity-search
  title: Similarity search
  summary: Embed the query, find the top-k nearest records, and return them with scores.
  minutes: 8
  body:
    objectives:
      - Implement top-k search in Python
      - Choose k sensibly
      - Use a score threshold
    intro: >-
      Similarity search is the core operation: turn the question into a vector, compare it with
      stored vectors, and return the k most similar records. A score threshold stops weak matches
      from being treated as answers.
    intro_eng: >-
      Top-k retrieval with an optional minimum score. k balances recall against prompt length;
      thresholds reduce irrelevant context but must be tuned per model.
    scenes:
      - engine: space
        title: How does a vector DB find similar documents?
        track: [Embed, Query, Measure, Rank, Return]
        groups: {pets: l4, food: l2, code: l7}
        points:
          - {label: puppy training, x: 62, y: 58, group: pets}
          - {label: dog food brands, x: 112, y: 40, group: pets}
          - {label: cat toys, x: 48, y: 108, group: pets}
          - {label: kitten care, x: 104, y: 98, group: pets}
          - {label: pasta recipe, x: 300, y: 52, group: food}
          - {label: pizza dough, x: 340, y: 84, group: food}
          - {label: python loops, x: 190, y: 190, group: code}
          - {label: SQL joins, x: 250, y: 206, group: code}
        query: {label: "train my puppy?", x: 86, y: 74}
        steps:
          - {at: 0, caption: "Every document is a point on the meaning map."}
          - {at: 1, show_query: true, caption: "The question is embedded the same way and lands on the map."}
          - {at: 2, show_query: true, lines: true, caption: "Measure how close it is to every document."}
          - {at: 3, show_query: true, lines: true, top: 3, caption: "Keep the 3 closest (top-k = 3). The rest are ignored."}
          - {at: 4, show_query: true, lines: true, top: 3, results: true, tone: good, caption: "Return those 3 with their scores."}
    points:
      - {title: Embed the query, text: "With the same model used for the documents.", step: 1}
      - {title: Score every candidate, text: "Or let an index narrow candidates first.", step: 2}
      - {title: Keep the top k, text: "Often 3 to 10 for RAG.", step: 3}
      - {title: Use a threshold, text: "If even the best score is low, say 'not found' instead of guessing.", step: 4}
    words:
      - [Top-k, The k best matches.]
      - [Threshold, A minimum score to count as a match.]
    code:
      file: search.py
      source: |
        import math

        def cosine(a, b):
            dot = sum(x * y for x, y in zip(a, b))
            return dot / (math.sqrt(sum(x*x for x in a)) * math.sqrt(sum(x*x for x in b)))

        docs = {"puppy training": [0.9, 0.1], "pasta recipe": [0.1, 0.9], "dog food": [0.8, 0.3]}
        query = [0.85, 0.2]
        scores = {name: round(cosine(query, v), 3) for name, v in docs.items()}
        top = sorted(scores, key=scores.get, reverse=True)[:2]
        print(top)
      notes:
        7: ["Three documents with tiny made-up 2-number embeddings.", "Toy vectors for illustration."]
        8: ["The question's embedding.", "Query vector."]
        9: ["Score every document against the question.", "Brute-force scoring."]
        10: ["Sort by score and keep the best 2.", "Top-k selection."]
        11: ["puppy training and dog food win.", "Result."]
    exercise:
      prompt: "Write top_k(scores, k, min_score) returning names of the best k with score ≥ min_score, best first."
      starter: |
        def top_k(scores, k, min_score):
            # scores is a dict like {"a": 0.9, "b": 0.2}
            pass
      tests: |
        s = {"a": 0.91, "b": 0.42, "c": 0.77, "d": 0.12}
        assert top_k(s, 2, 0.0) == ["a", "c"], "Best two should be a then c"
        assert top_k(s, 3, 0.5) == ["a", "c"], "Only scores ≥ 0.5 count"
        assert top_k(s, 3, 0.95) == [], "Nothing clears 0.95"
      solution: |
        def top_k(scores, k, min_score):
            ok = [n for n in scores if scores[n] >= min_score]
            return sorted(ok, key=scores.get, reverse=True)[:k]
    checks:
      - id: k-big
        type: predict
        prompt: "You set k = 50 for a chatbot's RAG context. Likely effect?"
        options: ["Better answers always", "Longer, costlier prompts with more irrelevant text", "Fewer results"]
        answer: 1
        explain: "More chunks means more noise and tokens. Most apps use 3–10."
      - id: threshold
        type: mcq
        prompt: "The best match scores 0.21 (low). What should the app do?"
        options: ["Answer from it anyway", "Say it couldn't find this in the documents", "Increase temperature"]
        answer: 1
        explain: "A threshold prevents confident answers from weak evidence."
    lab: lab-semantic-search

- slug: hands-on-vector-db
  title: Hands-on vector database
  summary: Build a tiny in-memory vector store with insert, filter and search.
  minutes: 12
  body:
    objectives:
      - Implement add() and search() for a vector store
      - Add metadata filtering
      - Explain what a real vector DB adds on top
    intro: >-
      The fastest way to understand a vector database is to build a tiny one. A Python list of
      records, a cosine function, a filter and a sort is a working vector store. Real ones add
      indexes, persistence and scale.
    intro_eng: >-
      A brute-force store is O(N·d) per query; production systems add ANN indexes, durable
      storage, concurrent writes, replication and filtered search at scale.
    scenes:
      - engine: code
        title: A vector store in a few lines
        track: [Store, Add, Add, Search]
        source: |
          store = []
          store.append({"id": 1, "v": [0.9, 0.1], "src": "faq"})
          store.append({"id": 2, "v": [0.2, 0.8], "src": "blog"})
          hits = [r["id"] for r in store if r["src"] == "faq"]
        steps:
          - {at: 0, line: 1, vars: {store: "[]"}, changed: [store], out: "", caption: "The store is just a list of records."}
          - {at: 1, line: 2, vars: {store: "[{id 1, faq}]"}, changed: [store], out: "", caption: "Add a record with an ID, a vector and metadata."}
          - {at: 2, line: 3, vars: {store: "[{id 1, faq}, {id 2, blog}]"}, changed: [store], out: "", caption: "Add another."}
          - {at: 3, line: 4, vars: {store: "[{id 1, faq}, {id 2, blog}]", hits: "[1]"}, changed: [hits], out: "", tone: good, caption: "A metadata filter keeps only FAQ records. Next, rank them by cosine."}
    points:
      - {title: Records in a list, text: "That's a vector store at its simplest.", step: 1}
      - {title: Filter, then rank, text: "Exact conditions first, similarity second.", step: 3}
      - {title: Real DBs add scale, text: "Indexes, saving to disk, many users at once.", eng: "Plus deletes/updates, backups, monitoring and access control."}
    words:
      - [In-memory, Kept in RAM; lost when the program stops.]
    code:
      file: tiny_store.py
      source: |
        import math

        def cosine(a, b):
            dot = sum(x * y for x, y in zip(a, b))
            return dot / (math.sqrt(sum(x*x for x in a)) * math.sqrt(sum(x*x for x in b)))

        class TinyStore:
            def __init__(self):
                self.rows = []

            def add(self, id, vector, text, source):
                self.rows.append({"id": id, "v": vector, "text": text, "source": source})

            def search(self, query, k=2, source=None):
                rows = [r for r in self.rows if source is None or r["source"] == source]
                ranked = sorted(rows, key=lambda r: cosine(query, r["v"]), reverse=True)
                return [r["text"] for r in ranked[:k]]

        db = TinyStore()
        db.add(1, [0.9, 0.1], "Casual leave is 12 days", "hr")
        db.add(2, [0.2, 0.9], "Pantry opens at 9", "office")
        db.add(3, [0.8, 0.3], "Sick leave needs a note", "hr")
        print(db.search([0.85, 0.2], k=2, source="hr"))
      notes:
        7: ["A tiny vector store as a class.", "Encapsulate state and operations."]
        9: ["It keeps records in a list.", "Backing storage."]
        11: ["add() saves a record.", "Insert."]
        14: ["search() finds the best matches.", "Query with optional filter."]
        15: ["Apply the filter first.", "Pre-filtering."]
        16: ["Rank by cosine, best first.", "Brute-force ranking."]
        17: ["Return the top k texts.", "Top-k."]
        23: ["Search only HR documents.", "Filtered search."]
    checks:
      - id: what-adds
        type: multi
        prompt: "What does a real vector DB add beyond this tiny store? Pick all that apply."
        options: ["Indexes for fast search", "Saving to disk", "Handling many users at once", "Making embeddings smarter"]
        answer: [0, 1, 2]
        explain: "Embedding quality comes from the model, not the database."
      - id: filter-bug
        type: debug
        prompt: "search(source='hr') returns office documents too. Tap the buggy line."
        code: |
          def search(self, query, k=2, source=None):
              rows = [r for r in self.rows if source is None or r["source"] != source]
              ranked = sorted(rows, key=lambda r: cosine(query, r["v"]), reverse=True)
              return ranked[:k]
        answer: 2
        explain: "It uses != so it keeps everything except the requested source. It should be ==."

project:
  slug: semantic-search-notes
  title: Semantic search over your notes
  body:
    problem: >-
      Students have years of notes they can never find again. Build a semantic search tool over
      a folder of text notes: embed them, store them with metadata, and search by meaning with
      filters.
    requirements:
      - "Load at least 30 short notes (text files or a JSON list) with a subject field"
      - "Embed them with any embedding model or library, and store vectors with metadata"
      - "A search(query, k, subject=None) function returning text, subject and score"
      - "A score threshold that returns 'nothing relevant' for unrelated queries"
      - "A README with 5 example queries, their results, and one failure you found"
    milestones:
      - Collect and clean 30+ notes
      - Embed and store them
      - Implement search with top-k
      - Add the subject filter and threshold
      - Write the README with examples and a failure analysis
    rubric:
      - {name: Search works by meaning, points: 30, pass: "Queries with different wording find the right notes"}
      - {name: Filter and threshold, points: 20, pass: "Subject filter is exact; threshold blocks unrelated queries"}
      - {name: Code quality, points: 15, pass: "Clear functions, no secrets in code"}
      - {name: README examples, points: 20, pass: "5 queries with results and scores"}
      - {name: Honest failure analysis, points: 15, pass: "One real failure explained"}
    pass_mark: 70
    submit: "Push your code to a public GitHub repository and paste its link."
