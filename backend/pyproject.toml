[project]
name = "copilot-backend"
version = "0.1.0"
description = "Job Application Copilot API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "arq>=0.25.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.124",
    "fastapi>=0.162.0",
    "pdfplumber>=0.11.10",
    "phonenumbers>=9.0.42",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "moto>=5.2.5",
    "mypy>=2.4.1",
    "pypdf>=6.21.4",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "reportlab>=5.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Resume text is full of typographic dashes and long regular expressions.
"app/resume_pipeline/parsing/*" = ["RUF001", "E501"]
"tests/**" = ["S101", "S105", "S106", "S107", "S603", "RUF001", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "pytesseract", "moto"]
ignore_missing_imports = true
