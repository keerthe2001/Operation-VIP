# Render Blueprint for HuntExams: one web service (API + website) and one Postgres database.
# In Render: New → Blueprint → this repository. Then set HX_ADMIN_EMAILS in the dashboard.
# Free plans: the web service sleeps after 15 idle minutes (first visit then takes ~1 minute),
# and a free Postgres database expires 30 days after creation unless upgraded.
services:
  - type: web
    name: huntexams
    runtime: docker
    dockerfilePath: ./huntexams/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HX_DATABASE_URL
        fromDatabase:
          name: huntexams-db
          property: connectionString
      - key: HX_SECRET_KEY
        generateValue: true
      - key: HX_COOKIE_SECURE
        value: "true"
      - key: HX_ADMIN_EMAILS
        sync: false
      - key: HX_PUBLIC_SITE_URL
        value: https://huntexams.com
      - key: HX_ADSENSE_PUBLISHER_ID
        sync: false

databases:
  - name: huntexams-db
    databaseName: huntexams
    user: huntexams
    plan: free
    region: singapore
