server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API so the session cookie stays first-party.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Pyodide (the Python sandbox) is large and versioned: cache it hard.
  location /pyodide/ {
    types { application/wasm wasm; text/javascript mjs; application/json json; application/zip zip; }
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  location / {
    try_files $uri /index.html;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
  }
  gzip on;
  gzip_types text/css application/javascript text/javascript application/json application/wasm;
}
