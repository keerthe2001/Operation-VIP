# Local development stack. Resume files use a local volume; set STORAGE_BACKEND=s3
# (plus S3_* variables) to use any S3-compatible service instead.
# Usage (from repo root):
#   cp infra/.env.example infra/.env   # then set JWT_SECRET
#   docker compose -f infra/docker-compose.yml up --build
name: copilot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://copilot:copilot@postgres:5432/copilot
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/.env}
      COOKIE_SECURE: "true"
      RESUME_PROCESSING_MODE: queue
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /data/storage
    volumes: [resume-files:/data/storage]
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Processes uploaded resumes (text extraction, OCR, parsing) off the request path.
  worker:
    build: ../backend
    command: ["arq", "app.workers.resume_worker.WorkerSettings"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://copilot:copilot@postgres:5432/copilot
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/.env}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /data/storage
    volumes: [resume-files:/data/storage]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  resume-files:
